[package]
name = "agent-mem"
version = "1.3.0"
edition = "2024"
authors = ["Marco Soto Maceda <158858927+marcosotomac@users.noreply.github.com>"]
description = "Local-first, sub-millisecond memory engine for AI coding agents"
readme = "README.md"
license = "MIT"
repository = "https://github.com/marcosotomac/agent-mem"
homepage = "https://github.com/marcosotomac/agent-mem"
keywords = ["ai", "mcp", "memory", "sqlite", "agent"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]
semantic-local = ["dep:fastembed", "dep:usearch"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = { version = "0.30", optional = true, default-features = false, features = ["crossterm", "std"] }
crossterm = { version = "0.29", optional = true }
fastembed = { version = "7.0", optional = true, default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
usearch = { version = "2.26", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[[bench]]
name = "bench_suite"
harness = false
