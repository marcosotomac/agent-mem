name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/check-release-metadata.sh "${GITHUB_REF_NAME}"

  build-release:
    name: Build (${{ matrix.target }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: agent-mem-darwin-aarch64.tar.gz
            use_cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: agent-mem-darwin-x86_64.tar.gz
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: agent-mem-linux-x86_64.tar.gz
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: agent-mem-linux-aarch64.tar.gz
            use_cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: agent-mem-windows-x86_64.zip
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (if cross-compiling)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --locked --release --target ${{ matrix.target }}
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }} agent-mem
          cd ../../..
        shell: bash

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          powershell -Command "Compress-Archive -Path agent-mem.exe -DestinationPath ../../../${{ matrix.asset_name }} -Force"
          cd ../../..
        shell: bash

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  verify-install:
    name: Clean install (${{ matrix.name }})
    needs: build-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            asset_name: agent-mem-linux-x86_64.tar.gz
            windows: false
          - name: macOS
            os: macos-latest
            asset_name: agent-mem-darwin-x86_64.tar.gz
            windows: false
          - name: Windows
            os: windows-latest
            asset_name: agent-mem-windows-x86_64.zip
            windows: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.asset_name }}
          path: release-under-test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify clean Unix install and npm launcher
        if: ${{ matrix.windows == false }}
        shell: bash
        run: |
          tar -xzf "release-under-test/${{ matrix.asset_name }}" -C release-under-test
          binary="$PWD/release-under-test/agent-mem"
          test "$("$binary" --version)" = "agent-mem ${GITHUB_REF_NAME#v}"
          sandbox="$(mktemp -d)"
          "$binary" init "$sandbox"
          cd "$sandbox"
          "$binary" set release/smoke verified
          test "$("$binary" get release/smoke)" = "verified"
          cd "$GITHUB_WORKSPACE"
          AGENT_MEM_BINARY="$binary" node npm/bin/agent-mem.js --version
      - name: Verify clean Windows install and npm launcher
        if: ${{ matrix.windows }}
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "release-under-test/${{ matrix.asset_name }}" -DestinationPath release-under-test -Force
          $binary = (Resolve-Path "release-under-test/agent-mem.exe").Path
          if ((& $binary --version) -ne "agent-mem $($env:GITHUB_REF_NAME.TrimStart('v'))") { throw "version mismatch" }
          $sandbox = Join-Path $env:RUNNER_TEMP "agent-mem-clean-install"
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          & $binary init $sandbox
          Push-Location $sandbox
          & $binary set release/smoke verified
          if ((& $binary get release/smoke) -ne "verified") { throw "round-trip failed" }
          Pop-Location
          $env:AGENT_MEM_BINARY = $binary
          node npm/bin/agent-mem.js --version

  publish-release:
    name: Publish GitHub Release
    needs: [build-release, verify-install]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
        shell: bash

      - name: Attest release archives and checksum manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-npm:
    name: Publish npm package
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support
        run: npm install --global npm@latest
      - run: npm publish --provenance --access public
        working-directory: npm

  publish-homebrew:
    name: Publish Homebrew formula
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          repository: marcosotomac/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Render formula with release checksums
        run: scripts/render-homebrew-formula.sh "${GITHUB_REF_NAME}" release-assets tap/Formula/agent-mem.rb
      - name: Publish formula
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-mem.rb
          git diff --cached --quiet || git commit -m "chore: update agent-mem to ${GITHUB_REF_NAME}"
          git push
